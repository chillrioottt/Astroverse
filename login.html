<!doctype html>
<html>
    <head>
        <title>Astroverse - Exploring The Cosmos</title>
    </head>
    <body>
        <h1>ASTROVERSE</h1>
        <br>
        <br>
        <br>
        <br>
        <br>
        <h3>we're so excited to see you back!</h3>
        <br>
        <br>
        <br>
        <br>
        <input type="text" placeholder="email address" id="email"></input>
        <br>
        <br>
        <input type="password" placeholder="password" id="password"></input>
        <br>
        <p class="p"></p>
        <br>
        <button onclick="login()">Log In</button>
    </body>
    <style>
        body {
            text-align: center;
            font-family: "Exo 2";
            background-color: rgb(0, 17, 29);
            color: white;
        }
        input {
            background-color: rgb(24, 24, 24);
            border: solid 1px rgb(2, 37, 134);
            font-size: 15px;
            height: 40px;
            width: 500px;
            border-radius: 5px;
            color: rgb(2, 37, 134);
            font-family: "Exo 2";
        }
        button {
            font-size: 15px;
            background-color: rgb(2, 37, 134);
            color:white;
            padding: 10px;
            width: 500px;
            height: 40px;
            border-radius: 5px;
            outline: none;
            box-shadow: none;
            border: none;
        }
        input::placeholder {
            color: rgb(2, 37, 134);
        }
        button:active {
            background-color: rgb(0, 28, 104);
            }
            .p {
                color: red;
            }
    </style>
    <script>
        function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const alertElement = document.querySelector(".p")
            if(email === "" || password === "") {
                alertElement.innerHTML = "please enter credentials"
                return;
            }
            //redirect
            window.location.href= "home.html";
        }
    </script>
</html>
